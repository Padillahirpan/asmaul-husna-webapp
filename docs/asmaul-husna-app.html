      { order: 17, arabic: 'ٱلرَّزَّاقُ', latin: 'Ar-Razzaq', meaning: 'Yang Maha Pemberi Rezeki', explanation: 'Allah menjamin dan membagikan rezeki lahir maupun batin kepada seluruh makhluk hidup di darat, laut, maupun udara.', citations: [{ refId: 'ref-quran', loc: 'QS. Adz-Dzariyat [51]: 58' }, { refId: 'ref-saadi', loc: 'Tafsir QS. Adz-Dzariyat: 58' }] },
      { order: 18, arabic: 'ٱلْفَتَّاحُ', latin: 'Al-Fattah', meaning: 'Yang Maha Pembuka Rahmat', explanation: 'Allah membuka pintu-pintu rahmat, rezeki, ilmu, jalan keluar dari kesulitan, serta memberi keputusan yang adil di antara hamba-Nya.', citations: [{ refId: 'ref-quran', loc: 'QS. Saba\' [34]: 26' }, { refId: 'ref-ghazali', loc: 'Bab Syarh Al-Fattah' }] },
      { order: 19, arabic: 'ٱلْعَلِيمُ', latin: 'Al-\'Alim', meaning: 'Yang Maha Mengetahui', explanation: 'Ilmu Allah meliputi segala sesuatu yang tampak maupun tersembunyi, yang telah berlalu, sedang terjadi, maupun yang akan datang.', citations: [{ refId: 'ref-quran', loc: 'QS. Al-Baqarah [2]: 29' }, { refId: 'ref-utsaimin', loc: 'Majmu\' Fatawa 1/122' }] },
      { order: 20, arabic: 'ٱلْقَابِضُ', latin: 'Al-Qabidh', meaning: 'Yang Maha Menyempitkan', explanation: 'Allah menahan dan menyempitkan rezeki atau kelapangan bagi sebagian hamba-Nya berdasarkan ilmu dan hikmah-Nya yang sempurna.', citations: [{ refId: 'ref-quran', loc: 'QS. Al-Baqarah [2]: 245' }, { refId: 'ref-ghazali', loc: 'Bab Syarh Al-Qabidh wa Al-Basith' }] },
      { order: 21, arabic: 'ٱلْبَاسِطُ', latin: 'Al-Basith', meaning: 'Yang Maha Melapangkan', explanation: 'Allah melapangkan rezeki, rahmat, dan ketenangan hati bagi hamba-hamba yang dikehendaki-Nya dengan penuh kemurahan.', citations: [{ refId: 'ref-quran', loc: 'QS. Al-Baqarah [2]: 245' }, { refId: 'ref-ghazali', loc: 'Bab Syarh Al-Qabidh wa Al-Basith' }] },
      { order: 22, arabic: 'ٱلْخَافِضُ', latin: 'Al-Khafidh', meaning: 'Yang Maha Merendahkan', explanation: 'Allah merendahkan derajat orang-orang yang sombong, zalim, dan menentang kebenaran.', citations: [{ refId: 'ref-ghazali', loc: 'Bab Syarh Al-Khafidh wa Ar-Rafi\'' }] },
      { order: 23, arabic: 'ٱلرَّافِعُ', latin: 'Ar-Rafi\'', meaning: 'Yang Maha Meninggikan', explanation: 'Allah meninggikan derajat hamba-hamba-Nya yang beriman, berilmu, dan bertakwa di dunia maupun di akhirat.', citations: [{ refId: 'ref-quran', loc: 'QS. Al-Mujadilah [58]: 11' }, { refId: 'ref-ghazali', loc: 'Bab Syarh Al-Khafidh wa Ar-Rafi\'' }] },
      { order: 24, arabic: 'ٱلْمُعِزُّ', latin: 'Al-Mu\'izz', meaning: 'Yang Maha Memuliakan', explanation: 'Allah menganugerahkan kemuliaan dan kehormatan sejati kepada siapa saja yang dikehendaki-Nya karena ketaatan kepada-Nya.', citations: [{ refId: 'ref-quran', loc: 'QS. Ali \'Imran [3]: 26' }, { refId: 'ref-saadi', loc: 'Tafsir QS. Ali \'Imran: 26' }] },

    const ASMAUL_HUSNA = [
      ...DETAILED_30_NAMES.map(item => ({
        ...item,

      })),
      ...REMAINING_69_NAMES.map((item, idx) => {

    /**
     * =========================================================================
     * 2. MODUL LOGIKA INTI (PURE FUNCTIONS SESUAI PRD v0.4)
     * =========================================================================

    const STORAGE_KEY = 'asmaul_husna_user_state_v1';

    function getTodayLocalStr() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function createDefaultUserState() {
      return {
        schemaVersion: 1,
        profile: {
          userName: '',
          targetDays: 30,
          startedAt: getTodayLocalStr(),
          onboardingCompleted: false
        },
        settings: {
          learningMode: 'sequential', // 'sequential' | 'random'
          theme: 'system' // 'light' | 'dark' | 'system'
        },
        progress: {
          unlockedStage: 1, // 1..7
          points: {}, // { [order]: 0..100 }
          lastPracticedAt: {}
        },
        history: {
          completedDates: [],
          lastSession: null
        }
      };
    }

    function loadUserState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultUserState();
        const parsed = JSON.parse(raw);
        return {
          ...createDefaultUserState(),
          ...parsed,
          profile: { ...createDefaultUserState().profile, ...(parsed.profile || {}) },
          settings: { ...createDefaultUserState().settings, ...(parsed.settings || {}) },
          progress: { ...createDefaultUserState().progress, ...(parsed.progress || {}) },
          history: { ...createDefaultUserState().history, ...(parsed.history || {}) },
        };
      } catch (e) {
        return createDefaultUserState();
      }
    }

    function saveUserState(state) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

    // Hitung rata-rata poin pada tahap tertentu (1..7)
    function calculateStageAverage(stage, pointsMap) {
      const stageNames = ASMAUL_HUSNA.filter(n => n.stage === stage);
      if (stageNames.length === 0) return 0;
      const sum = stageNames.reduce((acc, n) => acc + (pointsMap[n.order] || 0), 0);
      return Math.round((sum / stageNames.length) * 10) / 10;
    }

    // Hitung rata-rata seluruh 99 nama
    function calculateOverallAverage(pointsMap) {
      const sum = ASMAUL_HUSNA.reduce((acc, n) => acc + (pointsMap[n.order] || 0), 0);
      return Math.round((sum / ASMAUL_HUSNA.length) * 10) / 10;
    }

    // Pemilihan 15 nama untuk sesi drilling sesuai PRD v0.4
    function selectDrillingNames(userState) {
      const { learningMode } = userState.settings;
      const { unlockedStage, points } = userState.progress;

      let pool = [];
      if (learningMode === 'random') {
        pool = [...ASMAUL_HUSNA];
      } else {
        // Mode Bertahap: ambil dari seluruh nama yang sudah unlock (stage <= unlockedStage)
        pool = ASMAUL_HUSNA.filter(n => n.stage <= unlockedStage);
      }

      // Acak dulu agar yang berpoin sama urutannya acak, lalu urutkan dari poin terendah
      const shuffled = pool
        .map(item => ({ item, rand: Math.random() }))
        .sort((a, b) => a.rand - b.rand)
        .map(x => x.item);

      shuffled.sort((a, b) => (points[a.order] || 0) - (points[b.order] || 0));

      return shuffled.slice(0, 15);
    }

    // Kalkulasi streak harian & daftar tanggal Senin–Minggu pekan berjalan
    function getWeeklyStreakData(completedDates) {
      const completedSet = new Set(completedDates || []);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const todayStr = getTodayLocalStr();

      // Hitung streak beruntun (dari hari ini atau kemarin mundur ke belakang)
      let streak = 0;
      let cursor = new Date(today);
      if (!completedSet.has(todayStr)) {
        cursor.setDate(cursor.getDate() - 1);
      }
      while (true) {
        const y = cursor.getFullYear();
        const m = String(cursor.getMonth() + 1).padStart(2, '0');
        const d = String(cursor.getDate()).padStart(2, '0');
        const key = `${y}-${m}-${d}`;
        if (completedSet.has(key)) {
          streak++;
          cursor.setDate(cursor.getDate() - 1);
        } else {
          break;
        }
      }

      // Rentang Senin - Minggu pada pekan ini
      const dayOfWeek = today.getDay(); // 0 = Minggu, 1 = Senin, ...
      const diffToMonday = dayOfWeek === 0 ? -6 : 1 - dayOfWeek;
      const monday = new Date(today);
      monday.setDate(today.getDate() + diffToMonday);

      const dayLabels = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];
      const weekDays = [];
      for (let i = 0; i < 7; i++) {
        const d = new Date(monday);
        d.setDate(monday.getDate() + i);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const dayNum = String(d.getDate()).padStart(2, '0');
        const dateStr = `${y}-${m}-${dayNum}`;

        let status = 'upcoming'; // belum tiba
        if (completedSet.has(dateStr)) {
          status = 'done'; // sudah drilling
        } else if (dateStr === todayStr) {
          status = 'today'; // hari ini (belum drilling)
        } else if (d < today) {
          status = 'missed'; // hari lewat belum drilling
        }

        weekDays.push({
          label: dayLabels[i],
          dateNum: d.getDate(),
          dateStr,
          status
        });
      }

      return { streak, weekDays };
    }

    // Hitung hari ke-X sejak mulai onboarding
    function getDayNumber(startedAtStr) {
      if (!startedAtStr) return 1;
      const start = new Date(startedAtStr + 'T00:00:00');
      const now = new Date(getTodayLocalStr() + 'T00:00:00');
      const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
      return Math.max(1, diff + 1);
    }

    /**
     * =========================================================================
     * 3. STATE APLIKASI & NAVIGASI
     * =========================================================================
     */
    let userState = loadUserState();
    let currentRoute = userState.profile.onboardingCompleted ? 'dashboard' : 'onboarding';
    let selectedDetailOrder = 1;

    // State sementara untuk Onboarding
    let onboardingDraft = {

    // State sesi Drilling aktif
    let drillingSession = null;

    function applyTheme(theme) {
      const root = document.documentElement;
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (theme === 'dark' || (theme === 'system' && prefersDark)) {
        root.classList.add('dark');
      } else {
        root.classList.remove('dark');
      }
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {

      }
    });

    /**
     * =========================================================================
     * 4. LOGIKA SESI DRILLING INTERAKTIF
     * =========================================================================
     */
    function startNewDrillingSession() {
      const selected15 = selectDrillingNames(userState);
      // Bagi menjadi 5 pertanyaan, masing-masing 3 nama
      const questions = [];
      for (let i = 0; i < 5; i++) {
        const chunk = selected15.slice(i * 3, i * 3 + 3);
        const arabicCards = [...chunk].sort(() => Math.random() - 0.5);
        const meaningCards = [...chunk].sort(() => Math.random() - 0.5);
        questions.push({
          items: chunk,
          arabicCards,
          meaningCards,
          matchedOrders: [], // order yang sudah berhasil dipasangkan (benar atau salah terkunci)
          results: {} // { [order]: { correct: boolean, chosenMeaningOrder: number } }
        });
      }

      drillingSession = {
        questions,
        currentQIndex: 0,
        selectedArabicOrder: null,
        selectedMeaningOrder: null,
        feedbackState: null, // null | { isCorrect, arabicOrder, correctMeaning, chosenMeaning }
        netPoints: 0,
        correctCount: 0,
        completed: false,
        unlockedNewStage: null
      };

      navigate('drilling-session');
    }

    function handleSelectArabicCard(order) {
      if (!drillingSession || drillingSession.feedbackState) return;
      const q = drillingSession.questions[drillingSession.currentQIndex];
      if (q.matchedOrders.includes(order)) return;

      drillingSession.selectedArabicOrder =
        drillingSession.selectedArabicOrder === order ? null : order;

      if (drillingSession.selectedArabicOrder !== null && drillingSession.selectedMeaningOrder !== null) {
        evaluatePairMatch();
      } else {
        render();
      }
    }

    function handleSelectMeaningCard(order) {
      if (!drillingSession || drillingSession.feedbackState) return;
      const q = drillingSession.questions[drillingSession.currentQIndex];
      if (q.matchedOrders.includes(order)) return;

      drillingSession.selectedMeaningOrder =
        drillingSession.selectedMeaningOrder === order ? null : order;

      if (drillingSession.selectedArabicOrder !== null && drillingSession.selectedMeaningOrder !== null) {
        evaluatePairMatch();
      } else {
        render();
      }
    }

    function evaluatePairMatch() {
      const q = drillingSession.questions[drillingSession.currentQIndex];
      const arabicOrder = drillingSession.selectedArabicOrder;
      const meaningOrder = drillingSession.selectedMeaningOrder;
      const isCorrect = arabicOrder === meaningOrder;

      const targetItem = q.items.find(it => it.order === arabicOrder);
      const chosenItem = q.items.find(it => it.order === meaningOrder);

      // Update poin pada kartu Arab yang dipilih (+20 benar, -5 salah, batas 0..100)
      const prevPts = userState.progress.points[arabicOrder] || 0;
      const delta = isCorrect ? 20 : -5;
      const nextPts = Math.max(0, Math.min(100, prevPts + delta));
      const actualDelta = nextPts - prevPts;

      userState.progress.points[arabicOrder] = nextPts;
      userState.progress.lastPracticedAt[arabicOrder] = new Date().toISOString();
      saveUserState(userState);

      drillingSession.netPoints += delta;
      if (isCorrect) {
        drillingSession.correctCount += 1;
      }

      q.matchedOrders.push(arabicOrder);
      q.results[arabicOrder] = {
        isCorrect,
        chosenMeaning: chosenItem.meaning
      };

      drillingSession.selectedArabicOrder = null;
      drillingSession.selectedMeaningOrder = null;

      if (isCorrect) {
        drillingSession.feedbackState = {
          isCorrect: true,
          arabicOrder,
          arabicText: targetItem.arabic,
          correctMeaning: targetItem.meaning,
          delta: actualDelta
        };
        render();
        // Otomatis lanjut setelah jeda singkat bila benar
        setTimeout(() => {
          if (!drillingSession) return;
          drillingSession.feedbackState = null;
          advanceIfQuestionDone();
        }, 750);
      } else {
        // Jika salah: tampilkan pasangan arti yang benar secara jelas sebelum lanjut
        drillingSession.feedbackState = {
          isCorrect: false,
          arabicOrder,
          arabicText: targetItem.arabic,
          latin: targetItem.latin,
          correctMeaning: targetItem.meaning,
          chosenMeaning: chosenItem.meaning
        };
        render();
      }
    }

    function dismissWrongFeedback() {
      if (!drillingSession) return;
      drillingSession.feedbackState = null;
      advanceIfQuestionDone();
    }

    function advanceIfQuestionDone() {
      const q = drillingSession.questions[drillingSession.currentQIndex];
      if (q.matchedOrders.length >= 3) {
        if (drillingSession.currentQIndex < 4) {
          drillingSession.currentQIndex += 1;
          render();
        } else {
          finishDrillingSession();
        }
      } else {
        render();
      }
    }

    function finishDrillingSession() {
      const todayStr = getTodayLocalStr();
      if (!userState.history.completedDates.includes(todayStr)) {
        userState.history.completedDates.push(todayStr);
      }

      let unlockedNewStage = null;
      if (userState.settings.learningMode === 'sequential') {
        const currStage = userState.progress.unlockedStage;
        const avg = calculateStageAverage(currStage, userState.progress.points);
        if (avg >= 80 && currStage < 7) {
          userState.progress.unlockedStage = currStage + 1;
          unlockedNewStage = currStage + 1;
        }
      }

      const accuracyPercent = Math.round((drillingSession.correctCount / 15) * 100);
      userState.history.lastSession = {
        completedAt: new Date().toISOString(),
        mode: userState.settings.learningMode,
        netPoints: drillingSession.netPoints,
        correctCount: drillingSession.correctCount,
        totalPairs: 15,
        accuracyPercent,
        unlockedNewStage
      };

      saveUserState(userState);
      drillingSession.completed = true;
      drillingSession.unlockedNewStage = unlockedNewStage;
      render();
    }

                  onclick="onboardingDraft.learningMode = 'random'; render();"

                      ? 'bg-sakura-50 dark:bg-rose-950/30 border-rose-400 ring-1 ring-rose-400'

                    <span class="font-semibold text-sm text-stone-800 dark:text-stone-100">Acak semua 99 nama</span>
                  </div>

                </button>
              </div>
              <p class="text-[11px] text-stone-400 dark:text-stone-500 mt-1.5">

              </label>

                ${presetDays.map(d => `
                  <button
                    type="button"
                    onclick="onboardingDraft.targetDays = ${d}; onboardingDraft.isCustomDays = false; render();"
                    class="py-2.5 rounded-2xl text-xs font-semibold border transition cursor-pointer ${
                      !onboardingDraft.isCustomDays && onboardingDraft.targetDays === d
                        ? 'bg-rose-400 text-white border-rose-400 shadow-xs'
                        : 'bg-white dark:bg-stone-800 text-stone-700 dark:text-stone-300 border-cream-200 dark:border-stone-700'
                    }"
                  >
                    ${d} Hari

                <button
                  type="button"
                  onclick="onboardingDraft.isCustomDays = true; render();"
                  class="py-2.5 rounded-2xl text-xs font-semibold border transition cursor-pointer ${
                    onboardingDraft.isCustomDays
                      ? 'bg-rose-400 text-white border-rose-400 shadow-xs'
                      : 'bg-white dark:bg-stone-800 text-stone-700 dark:text-stone-300 border-cream-200 dark:border-stone-700'
                  }"

                    max="365"

                    oninput="onboardingDraft.targetDays = Math.max(1, parseInt(this.value) || 30)"
                    class="w-28 px-3.5 py-2.5 rounded-2xl bg-white dark:bg-stone-800 border border-cream-300 dark:border-stone-700 text-sm text-stone-800 dark:text-stone-100 focus:outline-none focus:ring-2 focus:ring-rose-400"
                  />

                </div>
              ` : ''}
            </div>
          </div>

          <button
            type="button"
            onclick="submitOnboarding()"
            class="w-full py-4 rounded-2xl bg-rose-400 hover:bg-rose-500 active:scale-[0.99] text-white font-semibold text-sm shadow-sm transition cursor-pointer"
          >
            Mulai Latihan
          </button>
        </div>
      `;
    }

    function submitOnboarding() {
      const name = onboardingDraft.userName.trim();
      if (!name) {
        showToast('Silakan isi nama Anda terlebih dahulu');
        const input = document.getElementById('ob-name');
        if (input) input.focus();
        return;
      }
      userState.profile.userName = name;
      userState.profile.targetDays = Math.max(1, onboardingDraft.targetDays || 30);
      userState.profile.startedAt = getTodayLocalStr();
      userState.profile.onboardingCompleted = true;
      userState.settings.learningMode = onboardingDraft.learningMode;
      saveUserState(userState);
      navigate('dashboard');
    }

                  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C9.5 6 6 8.5 6 13.5C6 17.09 8.91 20 12.5 20C16.09 20 19 17.09 19 13.5C19 10.5 17.5 8 16 6.5C15.8 8.2 14.8 9.2 13.8 9.5C14.5 7 13.5 4 12 2Z"/>

                    Target hari ke-${dayNumber} dari ${userState.profile.targetDays} hari
                  </p>
                </div>
              </div>
            </div>

            <!-- Deretan 7 Hari Senin-Minggu -->
            <div class="grid grid-cols-7 gap-1.5 text-center">
              ${weekDays.map(day => {
                let circleStyle = 'bg-cream-100 dark:bg-stone-800 text-stone-400 dark:text-stone-500 border-transparent';

          <!-- Card Recap Progres Utama (Klik menuju Halaman Drilling) -->
          <section

            <div class="flex items-end justify-between mb-2">
              <div>

                <span class="text-sm text-stone-500 dark:text-stone-400"> / 99 nama hafal</span>
              </div>
              <div class="text-right">
                <p class="text-xs text-stone-500 dark:text-stone-400">

                  ${renderStatusCircleSVG(0, 16)}

              <div class="p-3 rounded-2xl bg-rose-50/60 dark:bg-rose-950/20 border border-rose-200/50 dark:border-rose-900/40 flex items-center justify-between">

                  ${renderStatusCircleSVG(30, 16)}

                <span class="text-xs font-bold text-stone-800 dark:text-stone-100">${counts.learning}</span>

                <div class="flex items-center gap-2">
                  ${renderStatusCircleSVG(70, 16)}
                  <span class="text-xs text-stone-600 dark:text-stone-300">Hampir hafal</span>
                </div>
                <span class="text-xs font-bold text-stone-800 dark:text-stone-100">${counts.almost}</span>

    // --- HALAMAN 3: HALAMAN DRILLING + GRID 99 NAMA ---
    function renderDrillingPage() {
      const { learningMode } = userState.settings;
      const { unlockedStage, points } = userState.progress;
      const stageAvg = calculateStageAverage(unlockedStage, points);
      const overallAvg = calculateOverallAverage(points);
      const memorizedCount = ASMAUL_HUSNA.filter(n => (points[n.order] || 0) >= 100).length;

      return `
        <div class="flex-1 flex flex-col p-5 pb-10 page-enter">

          <header class="flex items-center gap-3 mb-5">
            <button
              type="button"
              onclick="navigate('dashboard')"
              aria-label="Kembali ke Dashboard"
              class="p-2.5 rounded-2xl bg-cream-100 dark:bg-stone-800 hover:bg-cream-200 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200 border border-cream-200 dark:border-stone-700 transition cursor-pointer"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div>
              <h1 class="text-lg font-bold text-stone-800 dark:text-stone-100">Drilling Hafalan</h1>
              <p class="text-xs text-stone-500 dark:text-stone-400">5 pertanyaan • 15 pasangan nama</p>
            </div>
          </header>

          <!-- Ringkasan Progres Sesuai Mode Aktif -->
          <section class="bg-white dark:bg-stone-800/70 border border-cream-200 dark:border-stone-800 rounded-3xl p-5 mb-5 shadow-2xs">
            ${learningMode === 'sequential' ? `
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-rose-500">
                  Tahap ${unlockedStage} dari 7
                </span>
                <span class="text-xs text-stone-500 dark:text-stone-400">
                  Ambang buka tahap: ≥ 80
                </span>
              </div>
              <div class="flex items-baseline justify-between mb-3">
                <p class="text-sm text-stone-600 dark:text-stone-300">

                <p class="text-2xl font-bold text-stone-800 dark:text-stone-100">
                  ${stageAvg} <span class="text-xs font-normal text-stone-400">/ 100</span>
                </p>
              </div>
              <div class="w-full h-2.5 bg-cream-200 dark:bg-stone-700 rounded-full overflow-hidden mb-3">
                <div class="h-full bg-rose-400 rounded-full transition-all" style="width: ${Math.min(100, (stageAvg / 80) * 100)}%"></div>
              </div>
              <p class="text-xs text-stone-500 dark:text-stone-400">
                Soal diambil acak dari ${unlockedStage === 7 ? '99' : unlockedStage * 15} nama yang sudah terbuka dengan prioritas poin terendah.
              </p>
            ` : `
              <div class="flex items-center justify-between mb-2">
                <span class="text-xs font-bold uppercase tracking-wider text-rose-500">
                  Mode Acak (99 Nama Terbuka)

                <p class="text-sm text-stone-600 dark:text-stone-300">
                  Rata-rata poin keseluruhan
                </p>
                <p class="text-2xl font-bold text-stone-800 dark:text-stone-100">
                  ${overallAvg} <span class="text-xs font-normal text-stone-400">/ 100</span>
                </p>
              </div>
              <div class="w-full h-2.5 bg-cream-200 dark:bg-stone-700 rounded-full overflow-hidden mb-3">
                <div class="h-full bg-rose-400 rounded-full transition-all" style="width: ${overallAvg}%"></div>
              </div>
              <p class="text-xs text-stone-500 dark:text-stone-400">
                Soal diacak dari seluruh 99 nama dengan prioritas poin terendah lebih dulu.
              </p>
            `}

            <button
              type="button"
              onclick="startNewDrillingSession()"
              class="w-full mt-4 py-3.5 rounded-2xl bg-rose-400 hover:bg-rose-500 active:scale-[0.99] text-white font-semibold text-sm shadow-sm transition cursor-pointer"
            >
              Mulai Drilling
            </button>
          </section>

          <!-- Grid 99 Nama -->
          <section class="mb-6">
            <div class="flex items-center justify-between mb-3">

                return `

                    type="button"
                    onclick="navigate('detail', ${item.order})"
                    class="relative text-left p-3 rounded-2xl border transition flex flex-col justify-between min-h-[112px] cursor-pointer ${

    // --- HALAMAN 3B: SESI DRILLING INTERAKTIF (5 PERTANYAAN & SUMMARY) ---
    function renderDrillingSession() {
      if (!drillingSession) {
        navigate('drilling');
        return '';
      }

      // Layar Summary setelah pertanyaan ke-5 selesai
      if (drillingSession.completed) {
        const accuracyPercent = Math.round((drillingSession.correctCount / 15) * 100);
        const net = drillingSession.netPoints;
        const newStage = drillingSession.unlockedNewStage;
        const stageRangeStart = newStage ? (newStage - 1) * 15 + 1 : 0;
        const stageRangeEnd = newStage ? (newStage === 7 ? 99 : newStage * 15) : 0;

        return `
          <div class="flex-1 flex flex-col justify-between p-6 page-enter">
            <div class="my-auto text-center">
              <div class="w-16 h-16 rounded-3xl bg-sakura-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-800 text-rose-500 flex items-center justify-center mx-auto mb-5">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                  <polyline points="22 4 12 14.01 9 11.01"></polyline>
                </svg>
              </div>

              <h1 class="text-2xl font-bold text-stone-800 dark:text-stone-100 mb-1">Sesi Drilling Selesai</h1>
              <p class="text-sm text-stone-500 dark:text-stone-400 mb-6">
                Alhamdulillah, Anda telah menyelesaikan 15 pasangan nama.
              </p>

              <!-- Notifikasi Buka Tahap Baru (jika tercapai >= 80) -->
              ${newStage ? `
                <div class="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800/70 mb-5 text-left">
                  <p class="text-xs font-bold uppercase tracking-wider text-emerald-600 dark:text-emerald-400 mb-1">
                    Tahap Baru Terbuka
                  </p>
                  <p class="text-sm font-semibold text-stone-800 dark:text-stone-100">
                    Tahap ${newStage} terbuka (Nama ${stageRangeStart}–${stageRangeEnd})
                  </p>
                  <p class="text-xs text-stone-500 dark:text-stone-400 mt-0.5">
                    Rata-rata poin tahap sebelumnya telah mencapai ≥ 80.
                  </p>
                </div>
              ` : ''}

              <!-- Kartu Statistik Summary -->
              <div class="grid grid-cols-2 gap-3 mb-6">
                <div class="p-4 rounded-3xl bg-white dark:bg-stone-800/80 border border-cream-200 dark:border-stone-800">
                  <p class="text-xs text-stone-500 dark:text-stone-400 mb-1">Poin Bersih Sesi</p>
                  <p class="text-2xl font-bold ${net >= 0 ? 'text-emerald-600 dark:text-emerald-400' : 'text-rose-500'}">
                    ${net >= 0 ? '+' : ''}${net}
                  </p>
                </div>
                <div class="p-4 rounded-3xl bg-white dark:bg-stone-800/80 border border-cream-200 dark:border-stone-800">
                  <p class="text-xs text-stone-500 dark:text-stone-400 mb-1">Akurasi Jawaban</p>
                  <p class="text-2xl font-bold text-stone-800 dark:text-stone-100">
                    ${accuracyPercent}%
                  </p>
                  <p class="text-[11px] text-stone-400 mt-0.5">${drillingSession.correctCount}/15 benar</p>
                </div>
              </div>
            </div>

            <button
              type="button"
              onclick="drillingSession = null; navigate('drilling');"
              class="w-full py-4 rounded-2xl bg-rose-400 hover:bg-rose-500 active:scale-[0.99] text-white font-semibold text-sm shadow-sm transition cursor-pointer"
            >
              Kembali ke Halaman Drilling
            </button>
          </div>
        `;
      }

      // Layar Pertanyaan Aktif (1/5 .. 5/5)
      const qIdx = drillingSession.currentQIndex;
      const q = drillingSession.questions[qIdx];
      const fb = drillingSession.feedbackState;

      return `
        <div class="flex-1 flex flex-col p-5 pb-8 page-enter">
          <!-- Header Progres Pertanyaan -->
          <header class="flex items-center justify-between mb-4">
            <button
              type="button"
              onclick="confirmExitDrilling()"
              class="p-2.5 rounded-2xl bg-cream-100 dark:bg-stone-800 text-stone-600 dark:text-stone-300 border border-cream-200 dark:border-stone-700 cursor-pointer"
              aria-label="Keluar Sesi"
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>

            <div class="flex-1 mx-4">
              <div class="flex justify-between text-xs font-semibold text-stone-600 dark:text-stone-300 mb-1.5">
                <span>Pertanyaan ${qIdx + 1} dari 5</span>
                <span class="text-rose-500">${drillingSession.netPoints >= 0 ? '+' : ''}${drillingSession.netPoints} poin</span>
              </div>
              <div class="w-full h-2 bg-cream-200 dark:bg-stone-800 rounded-full overflow-hidden">
                <div class="h-full bg-rose-400 rounded-full transition-all duration-300" style="width: ${((qIdx + (q.matchedOrders.length / 3)) / 5) * 100}%"></div>
              </div>
            </div>
          </header>

          <p class="text-xs text-center text-stone-500 dark:text-stone-400 mb-4">
            Pilih 1 lafaz Arab lalu pasangkan dengan artinya yang sesuai
          </p>

          <!-- Area 6 Kartu: 3 Kartu Arab (Atas) & 3 Kartu Arti (Bawah) -->
          <div class="flex-1 flex flex-col justify-center gap-5">
            <!-- Kelompok 3 Kartu Arab -->
            <div>
              <span class="block text-[11px] font-semibold uppercase tracking-wider text-stone-400 dark:text-stone-500 mb-2">
                Lafaz Arab
              </span>
              <div class="grid grid-cols-3 gap-2.5">
                ${q.arabicCards.map(card => {
                  const isMatched = q.matchedOrders.includes(card.order);
                  const res = q.results[card.order];
                  const isSelected = drillingSession.selectedArabicOrder === card.order;

                  let cardStyle = 'bg-white dark:bg-stone-800 border-cream-200 dark:border-stone-700 text-stone-800 dark:text-stone-100 hover:border-rose-300';
                  if (isMatched) {
                    cardStyle = res && res.isCorrect
                      ? 'bg-emerald-50/80 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 opacity-75 cursor-default'
                      : 'bg-rose-50/80 dark:bg-rose-950/40 border-rose-300 dark:border-rose-800 text-rose-700 dark:text-rose-300 opacity-75 cursor-default';
                  } else if (isSelected) {
                    cardStyle = 'bg-sakura-50 dark:bg-rose-950/50 border-rose-400 ring-2 ring-rose-400/50 text-stone-900 dark:text-white scale-[1.02]';
                  }

                  return `
                    <button
                      type="button"
                      ${isMatched ? 'disabled' : ''}
                      onclick="handleSelectArabicCard(${card.order})"
                      class="relative p-3 min-h-[96px] rounded-2xl border transition flex flex-col items-center justify-center shadow-2xs cursor-pointer ${cardStyle}"
                    >
                      ${isMatched ? `
                        <span class="absolute top-2 right-2 text-xs font-bold ${res && res.isCorrect ? 'text-emerald-500' : 'text-rose-500'}">
                          ${res && res.isCorrect ? '✓' : '✕'}
                        </span>
                      ` : ''}
                      <span class="arabic-text text-2xl font-bold text-center leading-normal">
                        ${card.arabic}
                      </span>
                    </button>
                  `;
                }).join('')}
              </div>
            </div>

            <!-- Kelompok 3 Kartu Arti -->
            <div>
              <span class="block text-[11px] font-semibold uppercase tracking-wider text-stone-400 dark:text-stone-500 mb-2">
                Arti Nama
              </span>
              <div class="grid grid-cols-1 gap-2.5">
                ${q.meaningCards.map(card => {
                  const isMatched = q.matchedOrders.includes(card.order);
                  const res = q.results[card.order];
                  const isSelected = drillingSession.selectedMeaningOrder === card.order;

                  let cardStyle = 'bg-white dark:bg-stone-800 border-cream-200 dark:border-stone-700 text-stone-700 dark:text-stone-200 hover:border-rose-300';
                  if (isMatched) {
                    cardStyle = res && res.isCorrect
                      ? 'bg-emerald-50/80 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-700 dark:text-emerald-300 opacity-75 cursor-default'
                      : 'bg-cream-100 dark:bg-stone-800/40 border-cream-200 dark:border-stone-800 text-stone-400 opacity-65 cursor-default';
                  } else if (isSelected) {
                    cardStyle = 'bg-sakura-50 dark:bg-rose-950/50 border-rose-400 ring-2 ring-rose-400/50 text-stone-900 dark:text-white';
                  }

                  return `
                    <button
                      type="button"
                      ${isMatched ? 'disabled' : ''}
                      onclick="handleSelectMeaningCard(${card.order})"
                      class="w-full px-4 py-3.5 rounded-2xl border text-left transition flex items-center justify-between shadow-2xs cursor-pointer ${cardStyle}"
                    >
                      <span class="text-sm font-medium">${card.meaning}</span>
                      ${isMatched ? `
                        <span class="text-xs font-bold ${res && res.isCorrect ? 'text-emerald-500' : 'text-stone-400'}">
                          ${res && res.isCorrect ? '✓ +20' : 'Terkunci'}
                        </span>
                      ` : ''}
                    </button>
                  `;
                }).join('')}
              </div>
            </div>
          </div>

          <!-- Panel Umpan Balik Jika Salah (Wajib menampilkan jawaban benar sebelum lanjut) -->
          ${fb && !fb.isCorrect ? `
            <div class="mt-4 p-4 rounded-3xl bg-rose-50 dark:bg-rose-950/60 border border-rose-300 dark:border-rose-800 animate-shake">
              <div class="flex items-start justify-between gap-3 mb-2">
                <div>
                  <span class="inline-block text-[11px] font-bold uppercase tracking-wider text-rose-600 dark:text-rose-400">
                    Kurang Tepat (-5 poin)
                  </span>
                  <p class="text-xs text-stone-600 dark:text-stone-300 mt-0.5">
                    Arti yang benar untuk <strong class="font-semibold">${fb.latin}</strong> adalah:
                  </p>
                </div>
                <span class="arabic-text text-2xl font-bold text-stone-800 dark:text-stone-100">${fb.arabicText}</span>
              </div>
              <div class="p-3 rounded-2xl bg-white dark:bg-stone-900 border border-rose-200 dark:border-rose-800/70 mb-3">
                <p class="text-sm font-bold text-emerald-600 dark:text-emerald-400">
                  ✓ ${fb.correctMeaning}
                </p>
              </div>
              <button
                type="button"
                onclick="dismissWrongFeedback()"
                class="w-full py-3 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold transition cursor-pointer"
              >
                Mengerti, Lanjutkan
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    function confirmExitDrilling() {
      openModal({
        title: 'Keluar dari Sesi Drilling?',
        message: 'Poin dari pasangan yang sudah dijawab tetap tersimpan, namun sesi ini tidak akan dihitung ke dalam streak harian.',
        actions: [
          { label: 'Lanjut Latihan', primary: false },
          {
            label: 'Keluar',
            primary: true,
            onClick: () => {
              drillingSession = null;
              navigate('drilling');
            }
          }
        ]
      });
    }

    // --- HALAMAN 4: DETAIL NAMA ---
    function renderDetailName() {
      const item = ASMAUL_HUSNA.find(n => n.order === selectedDetailOrder) || ASMAUL_HUSNA[0];
      const pts = userState.progress.points[item.order] || 0;
      const st = getNameStatus(pts);
      const isLocked = userState.settings.learningMode === 'sequential' && item.stage > userState.progress.unlockedStage;

      return `
        <div class="flex-1 flex flex-col p-5 pb-10 page-enter">
          <!-- Header Navigasi -->
          <header class="flex items-center justify-between mb-5">
            <button
              type="button"
              onclick="navigate('drilling')"
              class="p-2.5 rounded-2xl bg-cream-100 dark:bg-stone-800 hover:bg-cream-200 dark:hover:bg-stone-700 text-stone-700 dark:text-stone-200 border border-cream-200 dark:border-stone-700 transition cursor-pointer"
              aria-label="Kembali"
            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>

            <span class="text-xs font-semibold text-stone-500 dark:text-stone-400">
              Urutan ke-${item.order} • Tahap ${item.stage}
            </span>

            <div class="flex gap-1.5">
              <button
                type="button"
                ${item.order <= 1 ? 'disabled' : ''}
                onclick="navigate('detail', ${Math.max(1, item.order - 1)})"
                class="p-2.5 rounded-2xl bg-cream-100 dark:bg-stone-800 border border-cream-200 dark:border-stone-700 disabled:opacity-40 cursor-pointer"
                aria-label="Nama Sebelumnya"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="15 18 9 12 15 6"></polyline></svg>
              </button>
              <button
                type="button"
                ${item.order >= 99 ? 'disabled' : ''}
                onclick="navigate('detail', ${Math.min(99, item.order + 1)})"
                class="p-2.5 rounded-2xl bg-cream-100 dark:bg-stone-800 border border-cream-200 dark:border-stone-700 disabled:opacity-40 cursor-pointer"
                aria-label="Nama Berikutnya"
              >
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="9 18 15 12 9 6"></polyline></svg>
              </button>
            </div>
          </header>

          <!-- Kartu Utama Arab, Latin, Arti, & Poin -->
          <section class="bg-white dark:bg-stone-800/80 border border-cream-200 dark:border-stone-800 rounded-3xl p-6 text-center mb-4 shadow-2xs">
            ${isLocked ? `
              <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-cream-100 dark:bg-stone-800 text-stone-500 text-xs font-medium mb-3">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                Tahap ${item.stage} Belum Terbuka di Mode Bertahap
              </div>
            ` : ''}

            <p class="arabic-text text-5xl font-bold text-stone-800 dark:text-stone-100 my-3 leading-relaxed">
              ${item.arabic}
            </p>
            <h1 class="text-xl font-bold text-stone-800 dark:text-stone-100">
              ${item.latin}
            </h1>
            <p class="text-sm font-medium text-rose-500 mt-1 mb-5">
              ${item.meaning}
            </p>

            <!-- Lencana Poin & Status -->
            <div class="inline-flex items-center gap-2.5 px-4 py-2 rounded-2xl border ${st.bgClass}">
              ${renderStatusCircleSVG(pts, 18)}
              <span class="text-xs font-bold ${st.colorClass}">${st.label}</span>
              <span class="text-xs text-stone-400">•</span>
              <span class="text-xs font-bold text-stone-700 dark:text-stone-200">${pts} / 100 poin</span>
            </div>
          </section>

          <!-- Penjelasan Makna -->
          <section class="bg-white dark:bg-stone-800/80 border border-cream-200 dark:border-stone-800 rounded-3xl p-5 mb-4 shadow-2xs">
            <h2 class="text-xs font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500 mb-2">
              Penjelasan Makna
            </h2>
            <p class="text-sm text-stone-700 dark:text-stone-200 leading-relaxed">
              ${item.explanation}
            </p>
          </section>

          <!-- Daftar Referensi -->
          <section class="bg-white dark:bg-stone-800/80 border border-cream-200 dark:border-stone-800 rounded-3xl p-5 shadow-2xs">
            <h2 class="text-xs font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500 mb-3">
              Referensi Keilmuan
            </h2>
            <ul class="space-y-2.5">
              ${item.citations.map(cit => {
                const ref = REFERENCES[cit.refId];
                return `
                  <li class="p-3 rounded-2xl bg-cream-100/80 dark:bg-stone-900/70 border border-cream-200/70 dark:border-stone-800">
                    <p class="text-xs font-bold text-stone-800 dark:text-stone-100">${ref ? ref.title : cit.refId}</p>
                    <p class="text-[11px] text-stone-500 dark:text-stone-400 mt-0.5">
                      ${ref && ref.author ? `${ref.author} • ` : ''}${cit.loc}
                    </p>
                  </li>
                `;
              }).join('')}
            </ul>
          </section>
        </div>
      `;
    }

    function renderSetting() {

      const { learningMode, theme } = userState.settings;
      const presetDays = [30, 60, 90];

            >
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>

          <section class="bg-white dark:bg-stone-800/70 border border-cream-200 dark:border-stone-800 rounded-3xl p-5 mb-4">

              />
              <button
                type="button"
                onclick="updateUserName()"
                class="px-4 py-3 rounded-2xl bg-rose-400 hover:bg-rose-500 text-white text-xs font-semibold transition cursor-pointer"
              >
                Simpan
              </button>
            </div>
          </section>

          <!-- 2. Metode Hafalan Global -->
          <section class="bg-white dark:bg-stone-800/70 border border-cream-200 dark:border-stone-800 rounded-3xl p-5 mb-4">
            <label class="block text-xs font-bold uppercase tracking-wider text-stone-400 dark:text-stone-500 mb-1">
              Metode Hafalan
            </label>
            <p class="text-xs text-stone-500 dark:text-stone-400 mb-3">
              Mengubah tampilan gembok pada grid 99 nama dan aturan pengambilan soal drilling tanpa menghapus poin hafalan Anda.

            <div class="grid grid-cols-1 gap-2.5">
              <button
                type="button"
                onclick="changeLearningMode('sequential')"

                    : 'bg-cream-50/70 dark:bg-stone-900/60 border-cream-200 dark:border-stone-800'
                }"
              >
                <div class="flex items-center justify-between">
                  <span class="text-sm font-semibold text-stone-800 dark:text-stone-100">Bertahap (per 15 nama)</span>
                  ${learningMode === 'sequential' ? '<span class="text-xs font-bold text-rose-500">Aktif</span>' : ''}
                </div>
                <p class="text-xs text-stone-500 dark:text-stone-400 mt-0.5">
                  Membuka bertahap per 15 nama saat rata-rata poin tahap terbaru ≥ 80.

              </button>

              <button

                onclick="changeLearningMode('random')"

                    ? 'bg-sakura-50 dark:bg-rose-950/30 border-rose-400 ring-1 ring-rose-400'
                    : 'bg-cream-50/70 dark:bg-stone-900/60 border-cream-200 dark:border-stone-800'
                }"
              >
                <div class="flex items-center justify-between">
                  <span class="text-sm font-semibold text-stone-800 dark:text-stone-100">Acak (semua 99 nama)</span>
                  ${learningMode === 'random' ? '<span class="text-xs font-bold text-rose-500">Aktif</span>' : ''}
                </div>
                <p class="text-xs text-stone-500 dark:text-stone-400 mt-0.5">
                  Semua 99 nama langsung terbuka dan diacak berdasarkan poin terendah.
                </p>
              </button>
            </div>
          </section>

          <section class="bg-white dark:bg-stone-800/70 border border-cream-200 dark:border-stone-800 rounded-3xl p-5 mb-4">

            <div class="grid grid-cols-3 gap-2 mb-2.5">
              ${presetDays.map(d => `
                <button

                  onclick="updateTargetDays(${d})"

                    targetDays === d
                      ? 'bg-rose-400 text-white border-rose-400'

                  }"
                >
                  ${d} Hari

            <div class="flex items-center gap-2">
              <input

                class="w-28 px-3.5 py-2.5 rounded-2xl bg-cream-50 dark:bg-stone-900 border border-cream-300 dark:border-stone-700 text-sm text-stone-800 dark:text-stone-100 focus:outline-none focus:ring-2 focus:ring-rose-400"

            </h2>
            <p class="text-xs text-stone-500 dark:text-stone-400 mb-3">
              Menghapus seluruh poin nama, tahap terbuka, streak, dan riwayat drilling. Nama, mode, target, dan tema tetap disimpan.
            </p>
            <button
              type="button"
              onclick="confirmResetProgress()"
              class="w-full py-3 rounded-2xl bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 dark:hover:bg-rose-900/50 text-rose-600 dark:text-rose-400 border border-rose-200 dark:border-rose-800/70 text-xs font-semibold transition cursor-pointer"
            >
              Reset Progress Hafalan
            </button>
          </section>

          <!-- Versi Aplikasi -->
          <p class="text-center text-xs text-stone-400 dark:text-stone-500 mt-auto">
            ${META_CONTENT.version}
          </p>
        </div>
      `;
    }

    function updateUserName() {
      const input = document.getElementById('setting-name-input');
      const val = (input ? input.value : '').trim();
      if (!val) {
        showToast('Nama tidak boleh kosong');
        return;
      }
      userState.profile.userName = val;
      saveUserState(userState);
      showToast('Nama berhasil diperbarui');
      render();
    }

    function changeLearningMode(mode) {
      userState.settings.learningMode = mode;
      saveUserState(userState);
      showToast(mode === 'sequential' ? 'Mode Bertahap diaktifkan' : 'Mode Acak diaktifkan');
      render();
    }

    function updateTargetDays(days) {
      if (!days || days < 1) {
        showToast('Masukkan jumlah hari minimal 1');
        return;
      }
      userState.profile.targetDays = Math.min(365, days);
      saveUserState(userState);
      showToast(`Target diubah menjadi ${userState.profile.targetDays} hari`);
      render();
    }

    function changeTheme(theme) {
      userState.settings.theme = theme;
      saveUserState(userState);
      applyTheme(theme);
      render();
    }

    function confirmResetProgress() {
      openModal({
        title: 'Reset Seluruh Progres?',
        message: 'Semua poin hafalan (0–100), tahap terbuka, streak harian, dan riwayat drilling akan dihapus permanen. Tindakan ini tidak dapat dibatalkan.',
        actions: [
          { label: 'Batal', primary: false },
          {
            label: 'Ya, Reset Progres',
            primary: true,
            onClick: () => {
              userState.progress = {
                unlockedStage: 1,
                points: {},
                lastPracticedAt: {}
              };
              userState.history = {
                completedDates: [],
                lastSession: null
              };
              saveUserState(userState);
              showToast('Progres hafalan berhasil direset');
              render();
            }
          }
        ]
      });
    }

    /**
     * =========================================================================
     * 6. ROOT RENDERER & INISIALISASI
     * =========================================================================
     */
    function render() {
      const appEl = document.getElementById('app');
      let html = '';

      switch (currentRoute) {
        case 'onboarding':
          html = renderOnboarding();
          break;
        case 'dashboard':
          html = renderDashboard();
          break;
        case 'drilling':
          html = renderDrillingPage();
          break;
        case 'drilling-session':
          html = renderDrillingSession();
          break;
        case 'detail':
          html = renderDetailName();
          break;
        case 'setting':
          html = renderSetting();
          break;
        default:
          html = renderDashboard();
      }

      appEl.innerHTML = html;
    }

    window.onload = function () {
      applyTheme(userState.settings.theme);
      render();
    };
  </script>
</body>
</html>
